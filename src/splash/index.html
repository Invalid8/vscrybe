<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vScribe</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f5; --ink: #1c1c1d; --muted: #747476; --primary: #1c2b4a; --danger: #c43d3d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #212121; --ink: #ececec; --muted: #9a9a9a; --primary: #3d5d9e; --danger: #f06a6a; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
    main { display: grid; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
    .mark { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; color: #fff;
      background: linear-gradient(180deg, color-mix(in oklab, var(--primary) 84%, white), var(--primary) 70%);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.22), 0 6px 20px rgb(0 0 0 / 0.18); }
    .bars { display: flex; align-items: center; gap: 4px; height: 26px; }
    .bars i { width: 4px; height: 100%; border-radius: 2px; background: #fff; animation: bounce 0.9s ease-in-out infinite; }
    .bars i:nth-child(2) { animation-delay: -0.15s; } .bars i:nth-child(3) { animation-delay: -0.3s; } .bars i:nth-child(4) { animation-delay: -0.45s; }
    @keyframes bounce { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    h1 { margin: 6px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    p { margin: 0; max-width: 360px; color: var(--muted); }
    .error h1 { color: var(--danger); }
    @media (prefers-reduced-motion: reduce) { .bars i { animation: none; } }
  </style>
</head>
<body>
  <main id="state">
    <span class="mark"><span class="bars"><i></i><i></i><i></i><i></i></span></span>
    <h1>vScribe</h1>
    <p>Starting…</p>
  </main>
  <script>
    if (window.startupError) {
      const state = document.getElementById("state");
      state.classList.add("error");
      state.querySelector("h1").textContent = "Couldn't start";
      state.querySelector("p").textContent = window.startupError;
    }
  </script>
</body>
</html>
