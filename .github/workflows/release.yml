name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundle: src-tauri/target/release/bundle/deb/*.deb
          - name: windows
            os: windows-latest
            bundle: src-tauri/target/release/bundle/nsis/*.exe
          - name: macos
            os: macos-14
            bundle: src-tauri/target/release/bundle/dmg/*.dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev build-essential cmake file libclang-dev pkg-config

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: packaging/ffmpeg/out
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/ffmpeg/build.sh') }}

      - name: Build FFmpeg
        if: runner.os != 'Windows'
        run: packaging/ffmpeg/build.sh

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MSYS
          update: false
          install: make diffutils tar xz curl
          path-type: inherit

      - name: Build FFmpeg
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          rm -f /usr/bin/link.exe
          packaging/ffmpeg/build.sh

      - name: Point the build at pkg-config and libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install pkg-config
        if: runner.os == 'macOS'
        run: brew install pkgconf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.bundle }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: bundles
          merge-multiple: true

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bundles/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes
