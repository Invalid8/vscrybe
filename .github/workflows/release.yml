name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundle: src-tauri/target/release/bundle/deb/*.deb
          - name: windows
            os: windows-latest
            bundle: src-tauri/target/release/bundle/nsis/*.exe
          - name: macos
            os: macos-14
            bundle: src-tauri/target/release/bundle/dmg/*.dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev build-essential cmake file libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install GStreamer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.26.11"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          foreach ($msi in "gstreamer-1.0-msvc-x86_64-$version.msi", "gstreamer-1.0-devel-msvc-x86_64-$version.msi") {
            Invoke-WebRequest "$base/$msi" -OutFile $msi
            Start-Process msiexec -ArgumentList "/i", $msi, "/qn", "ADDLOCAL=ALL" -Wait
          }
          $pc = Get-ChildItem "C:\gstreamer", "C:\Program Files\gstreamer" -Recurse -Filter gstreamer-1.0.pc -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -like "*msvc_x86_64*" } | Select-Object -First 1
          if (-not $pc) { throw "GStreamer's pkg-config files weren't found after installing" }
          $root = $pc.Directory.Parent.Parent.FullName
          choco install pkgconfiglite -y --no-progress
          "PKG_CONFIG_PATH=$($pc.DirectoryName)" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - name: Install GStreamer
        if: runner.os == 'macOS'
        run: brew install gstreamer pkgconf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.bundle }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: bundles
          merge-multiple: true

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bundles/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes
