name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev build-essential cmake \
            libclang-dev pkg-config pulseaudio

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: packaging/ffmpeg/out
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/ffmpeg/build.sh') }}

      - name: Build FFmpeg
        run: packaging/ffmpeg/build.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/vscribe/models
          key: whisper-small-ct2-v2

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Download the Fast model
        run: src-tauri/target/debug/vscribe transcribe tests/fixtures/jfk.opus --stdout

      - name: Give the browsers a sound card
        run: pulseaudio --start --exit-idle-time=-1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/e2e/uv.lock') }}

      - run: uv run --project tests/e2e playwright install --with-deps chromium firefox

      - name: Browser tests
        run: uv run --project tests/e2e pytest tests/e2e --tracing retain-on-failure

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
