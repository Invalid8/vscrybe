[project]
name = "vscribe-e2e"
version = "0"
description = "Browser tests for vScribe, run against `vscribe serve`"
requires-python = ">=3.12"
dependencies = ["pytest>=9.1.1", "pytest-playwright>=0.9.0", "playwright>=1.63.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--browser chromium --browser firefox"
