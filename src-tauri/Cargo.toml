[package]
name = "vscribe"
version = "0.3.0"
description = "Convert audio and voice notes to text, on your own computer"
authors = ["vScribe contributors <b.fadamitan2019@gmail.com>"]
license = "MIT"
edition = "2024"

[lib]
name = "vscribe_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
notify-rust = "4"
tauri-plugin-single-instance = "2"
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "software-resampling", "static"] }
thiserror = "2"
tokenizers = "0.22"
flate2 = "1"
mel_spec = "0.3"
rustfft = "6"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
minijinja = { version = "2", features = ["loader", "json", "preserve_order"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
simplelog = "0.12"
percent-encoding = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
ct2rs = { version = "0.10.1", default-features = false, features = ["whisper", "dnnl", "openmp-runtime-comp"] }

[target.'cfg(target_os = "windows")'.dependencies]
ct2rs = { version = "0.10.1", default-features = false, features = ["whisper", "dnnl", "openmp-runtime-comp"] }

[target.'cfg(target_os = "macos")'.dependencies]
ct2rs = { version = "0.10.1", default-features = false, features = ["whisper", "accelerate", "ruy"] }

[profile.dev]
opt-level = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
